[project]
name = "form-finder"
version = "0.1.0"
description = "Describe a request; the AI finds the right form, asks 4-6 questions at a time, and fills it."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters this way on purpose.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:.*httpx2.*"]
